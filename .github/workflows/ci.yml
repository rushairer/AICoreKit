name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Test root package
        run: swift test

  coreai-runtime-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Build Core AI runtime for iOS
        working-directory: Runtime/CoreAIRuntime
        run: |
          xcodebuild \
            -scheme AICoreKitCoreAIRuntime \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AICoreKitCoreAIRuntime" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify Core AI runtime artifact
        run: |
          ./Scripts/verify-coreai-runtime-framework.sh \
            "$RUNNER_TEMP/AICoreKitCoreAIRuntime/Build/Products/Debug-iphoneos/PackageFrameworks/AICoreKitCoreAIRuntime.framework"
      - name: Verify lower-minimum host weak link
        run: |
          ./Scripts/build-verify-coreai-host-fixture.sh \
            "$RUNNER_TEMP/AICoreKitCoreAIRuntime/Build/Products/Debug-iphoneos/PackageFrameworks/AICoreKitCoreAIRuntime.framework"
