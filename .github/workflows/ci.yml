name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Test root package
        run: swift test
      - name: Build Swift 5 lifecycle consumer fixture
        run: swift build --package-path CompatibilityLab/Swift5LifecycleConsumer

  coreai-runtime-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Build reusable Core AI runtime artifact
        run: |
          /bin/sh ./Scripts/build-coreai-runtime-framework.sh \
            "$RUNNER_TEMP/AICoreKitRuntimeOutput" \
            Debug \
            iphoneos
      - name: Verify Core AI runtime artifact
        run: |
          ./Scripts/verify-coreai-runtime-framework.sh \
            "$RUNNER_TEMP/AICoreKitRuntimeOutput/AICoreKitCoreAIRuntime.framework"
      - name: Verify lower-minimum host weak link
        run: |
          ./Scripts/build-verify-coreai-host-fixture.sh \
            "$RUNNER_TEMP/AICoreKitRuntimeOutput/AICoreKitCoreAIRuntime.framework"
      - name: Verify lower-minimum app archive
        run: |
          ./Scripts/build-verify-coreai-archive-fixture.sh \
            "$RUNNER_TEMP/AICoreKitRuntimeOutput/AICoreKitCoreAIRuntime.framework"
